services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: franquicias
      POSTGRES_USER: franquicias
      POSTGRES_PASSWORD: franquicias
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U franquicias -d franquicias"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./franquicia
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/franquicias
    ports:
      - "8080:8080"

volumes:
  postgres-data:
